<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Organizador Personal</title>
  <!-- Tailwind CSS para el diseño -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Iconos Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Ocultar barra de scroll para estética de app móvil */
    ::-webkit-scrollbar { display: none; }
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans pb-24 antialiased min-h-screen">

  <!-- ENCABEZADO -->
  <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3">
    <div class="flex items-center justify-between max-w-md mx-auto">
      <h1 id="header-title" class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
        <span>📚 Tareas Escolares</span>
      </h1>
      <span id="current-date" class="text-xs text-slate-400"></span>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="max-w-md mx-auto px-4 pt-4">

    <!-- 1. SECCIÓN: TAREAS ESCOLARES -->
    <section id="tab-tasks" class="space-y-4">
      <form id="task-form" class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
        <h2 class="text-sm font-semibold text-slate-300">Nueva Tarea</h2>
        <input type="text" id="task-title" placeholder="Ej: Reporte de Física" required
          class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="task-subject" placeholder="Materia" required
            class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
          <input type="date" id="task-date" required
            class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-xl text-sm transition">
          Agregar Tarea
        </button>
      </form>
      <div id="tasks-list" class="space-y-2"></div>
    </section>

    <!-- 2. SECCIÓN: DIETAS -->
    <section id="tab-diet" class="hidden space-y-4">
      <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Selecciona el día</label>
        <select id="diet-day-select" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
          <option value="Lunes">Lunes</option>
          <option value="Martes">Martes</option>
          <option value="Miércoles">Miércoles</option>
          <option value="Jueves">Jueves</option>
          <option value="Viernes">Viernes</option>
          <option value="Sábado">Sábado</option>
          <option value="Domingo">Domingo</option>
        </select>
      </div>

      <div class="space-y-3">
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-2">
          <h3 class="text-sm font-bold text-emerald-400 flex items-center gap-2">🍳 Desayuno</h3>
          <textarea id="diet-desayuno" rows="2" placeholder="Escribe tu desayuno aquí..."
            class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none"></textarea>
        </div>
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-2">
          <h3 class="text-sm font-bold text-amber-400 flex items-center gap-2">🍲 Comida / Almuerzo</h3>
          <textarea id="diet-comida" rows="2" placeholder="Escribe tu comida aquí..."
            class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none"></textarea>
        </div>
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-2">
          <h3 class="text-sm font-bold text-indigo-400 flex items-center gap-2">🥗 Cena</h3>
          <textarea id="diet-cena" rows="2" placeholder="Escribe tu cena aquí..."
            class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none"></textarea>
        </div>
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-2">
          <h3 class="text-sm font-bold text-pink-400 flex items-center gap-2">🍎 Snacks / Colaciones</h3>
          <textarea id="diet-snacks" rows="2" placeholder="Fruta, frutos secos, etc..."
            class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none"></textarea>
        </div>
        <button onclick="saveDiet()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-xl text-sm transition">
          Guardar Menú del Día
        </button>
      </div>
    </section>

    <!-- 3. SECCIÓN: RECORDATORIOS -->
    <section id="tab-reminders" class="hidden space-y-4">
      <form id="reminder-form" class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
        <h2 class="text-sm font-semibold text-slate-300">Nuevo Recordatorio</h2>
        <input type="text" id="rem-text" placeholder="Ej: Comprar cartulina o tomar vitaminas" required
          class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
        <input type="datetime-local" id="rem-date" required
          class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
        <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-medium py-2 rounded-xl text-sm transition">
          Crear Recordatorio
        </button>
      </form>
      <div id="reminders-list" class="space-y-2"></div>
    </section>

    <!-- 4. SECCIÓN: TARJETAS Y FINANZAS -->
    <section id="tab-finances" class="hidden space-y-4">
      <!-- Tarjetas registradas (Slider horizontal o lista) -->
      <div>
        <div class="flex justify-between items-center mb-2">
          <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Mis Tarjetas (TDD y TDC)</h3>
          <button onclick="toggleCardModal()" class="text-xs text-indigo-400 font-medium">+ Agregar Tarjeta</button>
        </div>
        <div id="cards-container" class="space-y-3"></div>
      </div>

      <!-- Registrar Movimiento / Gasto -->
      <form id="expense-form" class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
        <h3 class="text-sm font-semibold text-slate-300">Registrar Gasto</h3>
        <select id="expense-card" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none"></select>
        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="expense-concept" placeholder="Concepto (ej: Comida)" required
            class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
          <input type="number" step="0.01" id="expense-amount" placeholder="Monto $" required
            class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
        </div>
        <button type="submit" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-medium py-2 rounded-xl text-sm transition">
          Descontar / Añadir Gasto
        </button>
      </form>

      <!-- Historial de Gastos -->
      <div>
        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Últimos Movimientos</h3>
        <div id="expenses-list" class="space-y-2"></div>
      </div>
    </section>

  </main>

  <!-- MODAL: AGREGAR TARJETA -->
  <div id="card-modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 w-full max-w-sm space-y-3">
      <h3 class="text-base font-bold text-white">Nueva Tarjeta</h3>
      <input type="text" id="card-name" placeholder="Banco o Nombre (ej: Nu, BBVA)" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
      <select id="card-type" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" onchange="toggleCardInputs()">
        <option value="TDC">Tarjeta de Crédito (TDC)</option>
        <option value="TDD">Tarjeta de Débito (TDD)</option>
      </select>
      <div id="tdc-fields" class="space-y-2">
        <input type="number" step="0.01" id="card-limit" placeholder="Límite de crédito $" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
        <div class="grid grid-cols-2 gap-2">
          <input type="number" id="card-cutoff" placeholder="Día corte (1-31)" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
          <input type="number" id="card-payday" placeholder="Día pago (1-31)" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
        </div>
      </div>
      <div id="tdd-fields" class="hidden">
        <input type="number" step="0.01" id="card-balance" placeholder="Saldo actual disponible $" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="toggleCardModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 rounded-xl text-sm">Cancelar</button>
        <button onclick="addCard()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-xl text-sm">Guardar</button>
      </div>
    </div>
  </div>

  <!-- BARRA DE NAVEGACIÓN INFERIOR (ESTILO APP MÓVIL) -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-3 py-2">
    <div class="max-w-md mx-auto grid grid-cols-4 gap-1">
      <button onclick="switchTab('tasks')" id="nav-tasks" class="flex flex-col items-center py-1 text-indigo-400">
        <i data-lucide="book-open" class="w-5 h-5 mb-1"></i>
        <span class="text-[10px] font-medium">Tareas</span>
      </button>
      <button onclick="switchTab('diet')" id="nav-diet" class="flex flex-col items-center py-1 text-slate-400 hover:text-slate-200">
        <i data-lucide="utensils" class="w-5 h-5 mb-1"></i>
        <span class="text-[10px] font-medium">Dieta</span>
      </button>
      <button onclick="switchTab('reminders')" id="nav-reminders" class="flex flex-col items-center py-1 text-slate-400 hover:text-slate-200">
        <i data-lucide="bell" class="w-5 h-5 mb-1"></i>
        <span class="text-[10px] font-medium">Avisos</span>
      </button>
      <button onclick="switchTab('finances')" id="nav-finances" class="flex flex-col items-center py-1 text-slate-400 hover:text-slate-200">
        <i data-lucide="credit-card" class="w-5 h-5 mb-1"></i>
        <span class="text-[10px] font-medium">Tarjetas</span>
      </button>
    </div>
  </nav>

  <!-- JAVASCRIPT: LÓGICA Y ALMACENAMIENTO -->
  <script>
    // Inicializar Iconos
    lucide.createIcons();

    // Fecha actual en encabezado
    document.getElementById('current-date').textContent = new Date().toLocaleDateString('es-MX', { weekday: 'short', day: 'numeric', month: 'short' });

    // Estado en LocalStorage
    let tasks = JSON.parse(localStorage.getItem('my_tasks')) || [];
    let diet = JSON.parse(localStorage.getItem('my_diet')) || {};
    let reminders = JSON.parse(localStorage.getItem('my_reminders')) || [];
    let cards = JSON.parse(localStorage.getItem('my_cards')) || [];
    let expenses = JSON.parse(localStorage.getItem('my_expenses')) || [];

    // NAVEGACIÓN ENTRE PESTAÑAS
    function switchTab(tabId) {
      const tabs = ['tasks', 'diet', 'reminders', 'finances'];
      const titles = {
        tasks: '📚 Tareas Escolares',
        diet: '🥗 Plan de Dietas',
        reminders: '⏰ Recordatorios',
        finances: '💳 Tarjetas y Finanzas'
      };

      tabs.forEach(t => {
        document.getElementById(`tab-${t}`).classList.toggle('hidden', t !== tabId);
        const navBtn = document.getElementById(`nav-${t}`);
        if(t === tabId) {
          navBtn.className = "flex flex-col items-center py-1 text-indigo-400";
        } else {
          navBtn.className = "flex flex-col items-center py-1 text-slate-400 hover:text-slate-200";
        }
      });
      document.getElementById('header-title').textContent = titles[tabId];
    }

    /* --- LÓGICA 1: TAREAS --- */
    document.getElementById('task-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('task-title').value;
      const subject = document.getElementById('task-subject').value;
      const date = document.getElementById('task-date').value;

      tasks.push({ id: Date.now(), title, subject, date, completed: false });
      localStorage.setItem('my_tasks', JSON.stringify(tasks));
      e.target.reset();
      renderTasks();
    });

    function toggleTask(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      localStorage.setItem('my_tasks', JSON.stringify(tasks));
      renderTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      localStorage.setItem('my_tasks', JSON.stringify(tasks));
      renderTasks();
    }

    function renderTasks() {
      const list = document.getElementById('tasks-list');
      if (tasks.length === 0) {
        list.innerHTML = `<p class="text-xs text-slate-500 text-center py-6">No tienes tareas pendientes.</p>`;
        return;
      }
      list.innerHTML = tasks.map(t => `
        <div class="flex items-center justify-between p-3 rounded-xl bg-slate-900 border border-slate-800 ${t.completed ? 'opacity-40' : ''}">
          <div class="flex items-center gap-3">
            <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask(${t.id})" class="rounded text-indigo-600 w-4 h-4 cursor-pointer">
            <div>
              <p class="text-sm font-medium ${t.completed ? 'line-through text-slate-400' : 'text-white'}">${t.title}</p>
              <span class="text-xs text-indigo-400">${t.subject}</span> • <span class="text-xs text-slate-500">Entrega: ${t.date}</span>
            </div>
          </div>
          <button onclick="deleteTask(${t.id})" class="text-slate-500 hover:text-rose-400 text-xs p-1">✕</button>
        </div>
      `).join('');
    }

    /* --- LÓGICA 2: DIETAS --- */
    const dietSelect = document.getElementById('diet-day-select');
    dietSelect.addEventListener('change', loadDietForDay);

    function loadDietForDay() {
      const day = dietSelect.value;
      const data = diet[day] || { desayuno: '', comida: '', cena: '', snacks: '' };
      document.getElementById('diet-desayuno').value = data.desayuno || '';
      document.getElementById('diet-comida').value = data.comida || '';
      document.getElementById('diet-cena').value = data.cena || '';
      document.getElementById('diet-snacks').value = data.snacks || '';
    }

    function saveDiet() {
      const day = dietSelect.value;
      diet[day] = {
        desayuno: document.getElementById('diet-desayuno').value,
        comida: document.getElementById('diet-comida').value,
        cena: document.getElementById('diet-cena').value,
        snacks: document.getElementById('diet-snacks').value,
      };
      localStorage.setItem('my_diet', JSON.stringify(diet));
      alert('¡Dieta de ' + day + ' guardada con éxito!');
    }

    /* --- LÓGICA 3: RECORDATORIOS --- */
    document.getElementById('reminder-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const text = document.getElementById('rem-text').value;
      const date = document.getElementById('rem-date').value;

      reminders.push({ id: Date.now(), text, date });
      localStorage.setItem('my_reminders', JSON.stringify(reminders));
      e.target.reset();
      renderReminders();
    });

    function deleteReminder(id) {
      reminders = reminders.filter(r => r.id !== id);
      localStorage.setItem('my_reminders', JSON.stringify(reminders));
      renderReminders();
    }

    function renderReminders() {
      const list = document.getElementById('reminders-list');
      if (reminders.length === 0) {
        list.innerHTML = `<p class="text-xs text-slate-500 text-center py-6">No hay recordatorios registrados.</p>`;
        return;
      }
      list.innerHTML = reminders.map(r => `
        <div class="flex items-center justify-between p-3 rounded-xl bg-slate-900 border border-slate-800">
          <div>
            <p class="text-sm font-medium text-white">${r.text}</p>
            <p class="text-xs text-amber-400 mt-0.5">🔔 ${new Date(r.date).toLocaleString('es-MX')}</p>
          </div>
          <button onclick="deleteReminder(${r.id})" class="text-slate-500 hover:text-rose-400 text-xs p-1">✕</button>
        </div>
      `).join('');
    }

    /* --- LÓGICA 4: FINANZAS Y TARJETAS (TDC / TDD) --- */
    function toggleCardModal() {
      document.getElementById('card-modal').classList.toggle('hidden');
    }

    function toggleCardInputs() {
      const isTDC = document.getElementById('card-type').value === 'TDC';
      document.getElementById('tdc-fields').classList.toggle('hidden', !isTDC);
      document.getElementById('tdd-fields').classList.toggle('hidden', isTDC);
    }

    function addCard() {
      const name = document.getElementById('card-name').value;
      const type = document.getElementById('card-type').value;

      if(!name) return alert('Ingresa el nombre del banco');

      if (type === 'TDC') {
        const limit = parseFloat(document.getElementById('card-limit').value) || 0;
        const cutoff = document.getElementById('card-cutoff').value || '1';
        const payday = document.getElementById('card-payday').value || '20';
        cards.push({ id: Date.now(), name, type, limit, debt: 0, cutoff, payday });
      } else {
        const balance = parseFloat(document.getElementById('card-balance').value) || 0;
        cards.push({ id: Date.now(), name, type, balance });
      }

      localStorage.setItem('my_cards', JSON.stringify(cards));
      toggleCardModal();
      renderCards();
      populateCardSelect();
    }

    function deleteCard(id) {
      if(confirm('¿Eliminar esta tarjeta?')) {
        cards = cards.filter(c => c.id !== id);
        localStorage.setItem('my_cards', JSON.stringify(cards));
        renderCards();
        populateCardSelect();
      }
    }

    function payCreditCard(id) {
      const amount = prompt("¿Cuánto deseas abonar a la tarjeta para reducir la deuda?");
      if(amount && !isNaN(amount)) {
        cards = cards.map(c => {
          if(c.id === id) {
            c.debt = Math.max(0, c.debt - parseFloat(amount));
          }
          return c;
        });
        localStorage.setItem('my_cards', JSON.stringify(cards));
        renderCards();
      }
    }

    function renderCards() {
      const container = document.getElementById('cards-container');
      if (cards.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-500 text-center py-4 bg-slate-900 rounded-xl border border-slate-800">No has registrado ninguna tarjeta TDC o TDD.</p>`;
        return;
      }
      container.innerHTML = cards.map(c => {
        if (c.type === 'TDC') {
          const available = c.limit - c.debt;
          return `
            <div class="p-4 rounded-2xl bg-gradient-to-br from-slate-900 to-indigo-950/60 border border-indigo-900/40 relative shadow-lg">
              <div class="flex justify-between items-center mb-1">
                <span class="text-xs font-bold text-indigo-400 bg-indigo-950/80 px-2 py-0.5 rounded-full border border-indigo-800">TDC Crédito</span>
                <button onclick="deleteCard(${c.id})" class="text-slate-500 hover:text-rose-400 text-xs">Eliminar</button>
              </div>
              <h4 class="text-base font-bold text-white">${c.name}</h4>
              
              <div class="grid grid-cols-2 gap-2 my-2 pt-2 border-t border-slate-800/80">
                <div>
                  <p class="text-[10px] text-slate-400">Deuda actual:</p>
                  <p class="text-sm font-bold text-rose-400">$${c.debt.toFixed(2)}</p>
                </div>
                <div>
                  <p class="text-[10px] text-slate-400">Crédito disponible:</p>
                  <p class="text-sm font-bold text-emerald-400">$${available.toFixed(2)}</p>
                </div>
              </div>

              <div class="flex justify-between items-center text-[11px] text-slate-400 mt-2">
                <span>Corte: día ${c.cutoff} | Pago: día ${c.payday}</span>
                <button onclick="payCreditCard(${c.id})" class="text-indigo-300 underline font-medium">Abonar / Pagar</button>
              </div>
            </div>
          `;
        } else {
          return `
            <div class="p-4 rounded-2xl bg-gradient-to-br from-slate-900 to-emerald-950/40 border border-emerald-900/40 relative shadow-lg">
              <div class="flex justify-between items-center mb-1">
                <span class="text-xs font-bold text-emerald-400 bg-emerald-950/80 px-2 py-0.5 rounded-full border border-emerald-800">TDD Débito</span>
                <button onclick="deleteCard(${c.id})" class="text-slate-500 hover:text-rose-400 text-xs">Eliminar</button>
              </div>
              <h4 class="text-base font-bold text-white">${c.name}</h4>
              <div class="my-2 pt-1 border-t border-slate-800/80">
                <p class="text-[10px] text-slate-400">Saldo disponible:</p>
                <p class="text-base font-bold text-emerald-400">$${c.balance.toFixed(2)}</p>
              </div>
            </div>
          `;
        }
      }).join('');
    }

    function populateCardSelect() {
      const select = document.getElementById('expense-card');
      if (cards.length === 0) {
        select.innerHTML = '<option value="">Primero agrega una tarjeta arriba</option>';
        return;
      }
      select.innerHTML = cards.map(c => `
        <option value="${c.id}">${c.name} (${c.type})</option>
      `).join('');
    }

    document.getElementById('expense-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const cardId = parseInt(document.getElementById('expense-card').value);
      const concept = document.getElementById('expense-concept').value;
      const amount = parseFloat(document.getElementById('expense-amount').value);

      if(!cardId || isNaN(amount)) return;

      // Actualizar tarjeta
      cards = cards.map(c => {
        if(c.id === cardId) {
          if(c.type === 'TDC') {
            c.debt += amount; // Sube la deuda
          } else {
            c.balance -= amount; // Resta saldo en débito
          }
        }
        return c;
      });

      expenses.unshift({ id: Date.now(), cardId, concept, amount, date: new Date().toLocaleDateString('es-MX') });

      localStorage.setItem('my_cards', JSON.stringify(cards));
      localStorage.setItem('my_expenses', JSON.stringify(expenses));
      
      e.target.reset();
      renderCards();
      populateCardSelect();
      renderExpenses();
    });

    function renderExpenses() {
      const list = document.getElementById('expenses-list');
      if (expenses.length === 0) {
        list.innerHTML = `<p class="text-xs text-slate-500 text-center py-2">Sin gastos registrados.</p>`;
        return;
      }
      list.innerHTML = expenses.slice(0, 10).map(exp => {
        const card = cards.find(c => c.id === exp.cardId);
        const cardName = card ? `${card.name} (${card.type})` : 'Tarjeta eliminada';
        return `
          <div class="flex justify-between items-center p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-xs">
            <div>
              <p class="font-medium text-white">${exp.concept}</p>
              <p class="text-[10px] text-slate-400">${cardName} • ${exp.date}</p>
            </div>
            <span class="font-bold text-rose-400">-$${exp.amount.toFixed(2)}</span>
          </div>
        `;
      }).join('');
    }

    // CARGA INICIAL
    renderTasks();
    loadDietForDay();
    renderReminders();
    renderCards();
    populateCardSelect();
    renderExpenses();
  </script>
</body>
</html>
